<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      프로필 이미지와 회사 로고가 이 두 호스트에 있다. 첫 이미지 요청 전에 DNS와 TCP와
      TLS를 끝내 둔다. <img> 요청은 CORS 요청이 아니므로 crossorigin은 붙이지 않는다.
    -->
    <link rel="preconnect" href="https://i.imgur.com" />
    <link
      rel="preconnect"
      href="https://unblind-kr.s3.ap-northeast-2.amazonaws.com"
    />
    <meta name="theme-color" content="#000000" />
    <title>Unblind</title>
    <meta name="description" content="Unblind | 당신의 이력을 더 빛나게" />

    <!--
      아래 태그는 모든 경로에 동일하게 적용되는 사이트 기본값이다.
      og:url은 여기 두지 않는다. 공유 플랫폼이 이 값을 공유 객체의 정본 주소로 삼기 때문에,
      고정값을 넣으면 프로필과 포스트를 각각 공유해도 전부 그 주소 하나로 합쳐진다.
      값이 없으면 크롤러가 실제 요청 URL을 쓴다. 경로별 메타는 페이지에서 Helmet으로 넣는다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unblind" />
    <meta property="og:title" content="Unblind" />
    <meta property="og:description" content="당신의 이력을 더 빛나게" />
    <meta property="og:image" content="https://unblind.kr/logo512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Unblind",
        "alternateName": "언블라인드",
        "url": "https://unblind.kr/"
      }
    </script>
  </head>
  <body>
    <noscript>Unblind를 사용하려면 JavaScript를 활성화해 주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
